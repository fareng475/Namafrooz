name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Namafrooz.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
        working-directory: Namafrooz
      - uses: actions/upload-artifact@v4
        with:
          name: Namafrooz-APK
          path: Namafrooz/app/build/outputs/apk/debug/*.apk
